name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Allows re-running the gate by hand without pushing.
  workflow_dispatch:

# A newer push to the same ref makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` (not `npm install`) so the lockfile is authoritative. This also runs on
      # linux/x64, which is what catches macOS-only optional binaries being committed as
      # hard dependencies — the failure mode that once broke the production deploy.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Executes every approach of every problem and asserts the emitted state is
      # actually renderable by the view components.
      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Report bundle size
        run: |
          echo "### Bundle" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -h dist/assets/* | sort -rh >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
